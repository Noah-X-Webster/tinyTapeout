# Tiny Tapeout project information
project:
  title:        "8-bit counter with asynchronous reset"      # Project title
  author:       "Noah Webster"      # Your name
  discord:      "noah_wabstar_xb"      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "Verilog code describing an 8-bit programmable binary counter with asynchronous reset, synchronous load and tri-state outputs"      # One line description of what your project does
  language:     "Verilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     0       # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 340x160 uM.
  tiles: "1x1"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 3x4 or 4x4

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_programmable_counter"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "project.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
# Input pins
inputs:
  - "data_in[0]"
  - "data_in[1]"
  - "data_in[2]"
  - "data_in[3]"
  - "data_in[4]"
  - "data_in[5]"
  - "data_in[6]"
  - "data_in[7]"

# Output pins
outputs:
  - "count_out[0]"
  - "count_out[1]"
  - "count_out[2]"
  - "count_out[3]"
  - "count_out[4]"
  - "count_out[5]"
  - "count_out[6]"
  - "count_out[7]"

# Bidirectional pins
bidirectional:
  - "load"      # uio[0] used as Load control
  - "oe"        # uio[1] used as Output Enable control
  - "unused"
  - "unused"
  - "unused"
  - "unused"
  - "unused"
  - "unused"

# Do not change!
yaml_version: 6
